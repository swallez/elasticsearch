apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.publish'

esplugin {
  name = 'esql-datasource-parquet-rs'
  description = 'parquet-rs backed native Parquet reader for ESQL external data sources'
  classname = 'org.elasticsearch.xpack.esql.datasource.parquet.parquetrs.ParquetRsPlugin'
  extendedPlugins = ['x-pack-esql']
}

base {
  archivesName = 'esql-datasource-parquet-rs'
}

dependencies {
  compileOnly project(path: xpackModule('esql'))
  compileOnly project(path: xpackModule('esql-core'))
  compileOnly project(path: xpackModule('core'))
  compileOnly project(':server')
  compileOnly project(xpackModule('esql:compute'))
  compileOnly project(xpackModule('esql:arrow'))

  // Arrow C Data Interface for zero-copy FFI transfer from Rust
  implementation("org.apache.arrow:arrow-c-data:18.3.0") {
    exclude group: 'org.slf4j'
  }
  implementation(project(':libs:arrow')) {
    exclude group: 'org.slf4j'
  }

  testImplementation("org.apache.parquet:parquet-hadoop-bundle:${versions.parquet}")
  testImplementation("org.apache.hadoop:hadoop-client-api:3.4.3")
  testImplementation("org.apache.hadoop:hadoop-client-runtime:3.4.3")

  testImplementation project(':test:framework')
  testImplementation(testArtifact(project(xpackModule('core'))))
}

// ---------------------------------------------------------------------------
// FlatBuffers code generation
// ---------------------------------------------------------------------------
//
// We do NOT use a host-installed `flatc`; the schemas must be compiled with
// the exact compiler versions used by Arrow-Java and Arrow-Rust.
//
// See also native/schema/build-flatc-images.sh
//
// Both tasks mount the project root into the container at `/workspace` and
// invoke flatc with paths relative to that mount point. Tasks are skipped on
// hosts without Docker, mirroring how `cargoBuild` skips when `cargo` is
// missing.

def fbsSchemaDir = "${project.projectDir}/native/schema"
def fbsSchemaFiles = ["filter_expr.fbs"]
def generatedJavaDir = "${project.layout.buildDirectory.get().asFile}/generated/sources/flatbuffers/main/java"
def generatedRustDir = "${project.projectDir}/native/src/generated"
//def flatcImage         = "docker.elastic.co/elasticsearch-dev/flatbuffers"
def flatcImage = "flatbuffers"
def flatcJavaVersion = "v23.5.26"
def flatcRustVersion = "v25.12.19"
def projectMount = "${project.projectDir}:/workspace"

def dockerPath = org.gradle.internal.os.OperatingSystem.current().findInPath("docker")

tasks.register("generateFlatBuffersJava", Exec) {
  description = "Generate Java sources from .fbs schemas using flatc-java in the esql-flatc Docker image"
  inputs.dir(fbsSchemaDir)
  outputs.dir(generatedJavaDir)
  doFirst {
    delete generatedJavaDir
    mkdir generatedJavaDir
  }
  def schemaArgs = fbsSchemaFiles.collect { "native/schema/${it}" }
  commandLine(["docker", "run", "--rm",
                "-v", projectMount,
                "-w", "/workspace",
                "${flatcImage}:${flatcJavaVersion}",
                "flatc",
                "--java",
                "-o", "build/generated/sources/flatbuffers/main/java"] + schemaArgs)
  onlyIf { dockerPath != null }
}

tasks.register("generateFlatBuffersRust", Exec) {
  description = "Generate Rust sources from .fbs schemas using flatc-rust in the esql-flatc Docker image"
  inputs.dir(fbsSchemaDir)
  // Outputs are the *_generated.rs files only, not the directory: native/src/generated/mod.rs
  // is hand-written (it re-exports the deeply-nested namespace as `fbs`) and must survive
  // regeneration.
  outputs.files(fileTree(generatedRustDir) { include "*_generated.rs" })
  doFirst {
    delete fileTree(generatedRustDir) { include "*_generated.rs" }
    mkdir generatedRustDir
  }
  def schemaArgs = fbsSchemaFiles.collect { "native/schema/${it}" }
  commandLine(["docker", "run", "--rm",
                "-v", projectMount,
                "-w", "/workspace",
                "${flatcImage}:${flatcRustVersion}",
                "flatc",
                "--rust",
                "-o", "native/src/generated"] + schemaArgs)
  onlyIf { dockerPath != null }
}

sourceSets {
  main {
    java {
      srcDir generatedJavaDir
    }
  }
}

tasks.named("compileJava").configure {
  dependsOn "generateFlatBuffersJava"
}

// generateNotice walks the main java source set without going through compileJava,
// so it doesn't pick up the dependency above. Wire it explicitly per the Gradle
// validation error's recommendation.
tasks.named("generateNotice").configure {
  dependsOn "generateFlatBuffersJava"
}

// ---------------------------------------------------------------------------
// Native Rust library build
// ---------------------------------------------------------------------------
def nativeDir = "${project.projectDir}/native"

def os = System.getProperty("os.name", "").toLowerCase()
def arch = System.getProperty("os.arch", "").toLowerCase()

String libFileName
String platformDir
if (os.contains("mac") || os.contains("darwin")) {
  libFileName = "libesql_parquet_rs.dylib"
  platformDir = arch.contains("aarch64") || arch.contains("arm64") ? "darwin-aarch64" : "darwin-x86_64"
} else if (os.contains("linux")) {
  libFileName = "libesql_parquet_rs.so"
  platformDir = arch.contains("aarch64") || arch.contains("arm64") ? "linux-aarch64" : "linux-x86_64"
} else {
  libFileName = "libesql_parquet_rs.so"
  platformDir = "unsupported"
}

def cargoOutputDir = "${nativeDir}/target/release"
def resourceTarget = "${project.projectDir}/src/main/resources/platform/${platformDir}"

tasks.register("cargoBuild", Exec) {
  description = "Build the native parquet-rs library with cargo (release mode)"
  dependsOn "generateFlatBuffersRust"
  workingDir nativeDir

  def cargoPath = org.gradle.internal.os.OperatingSystem.current().findInPath("cargo")
  if (cargoPath != null) {
    commandLine cargoPath.absolutePath, "build", "--release"
  } else {
    commandLine "cargo", "build", "--release"
  }

  inputs.dir("${nativeDir}/src")
  inputs.file("${nativeDir}/Cargo.toml")
  inputs.file("${nativeDir}/Cargo.lock")
  outputs.file("${cargoOutputDir}/${libFileName}")

  onlyIf {
    cargoPath != null
  }
}

tasks.register("copyNativeLib", Copy) {
  description = "Copy the built native library to the platform resources directory"
  dependsOn "cargoBuild"
  from "${cargoOutputDir}/${libFileName}"
  into resourceTarget
  filePermissions {
    unix("rw-r--r--")
  }
  onlyIf { new File("${cargoOutputDir}/${libFileName}").exists() }
}

// Force everything else to run after the native library is in place, so
// downstream consumers (test, processResources, ...) see the .dylib/.so.
// generateFlatBuffersRust is excluded because cargoBuild depends on it —
// participating in the mustRunAfter would create a cargoBuild → generate →
// copyNativeLib → cargoBuild cycle.
def afterCopyNativeLibExclusions = ["copyNativeLib", "cargoBuild", "generateFlatBuffersRust"] as Set
tasks.configureEach { task ->
  if (afterCopyNativeLibExclusions.contains(task.name) == false) {
    task.mustRunAfter("copyNativeLib")
  }
}

tasks.named("processResources").configure {
  dependsOn "copyNativeLib"
}

tasks.named("test").configure {
  def nativeLib = "${project.projectDir}/native/target/release/libesql_parquet_rs.dylib"
  if (new File(nativeLib).exists()) {
    systemProperty 'tests.native.lib.path', nativeLib
  }
  jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
}

tasks.named("dependencyLicenses").configure {
  mapping from: /arrow-.*/, to: 'arrow'
  mapping from: /parquet-.*/, to: 'parquet'
  mapping from: /hadoop-.*/, to: 'hadoop'
}

tasks.named("thirdPartyAudit").configure {
  ignoreMissingClasses()
}

tasks.named("forbiddenPatterns").configure {
  exclude '**/*.dylib'
  exclude '**/*.so'
}
