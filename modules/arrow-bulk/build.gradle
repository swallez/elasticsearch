apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-cluster-test'

esplugin {
  name = 'arrow-bulk'
  description = 'Provides Arrow integration for Elasticsearch'
  classname ='org.elasticsearch.arrow.bulk.ArrowPlugin'
}

dependencies {
  implementation(project(":libs:arrow"))

  testImplementation(project(":test:framework"))

  // Arrow data is also indexed in (time series) data streams
  internalClusterTestImplementation(project(":modules:data-streams"))
}
